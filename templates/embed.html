{# Shared Tableau embed block: expects viz_url #}
{% if viz_url %}
<script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>
<div class="viz-wrap">
  <tableau-viz src="{{ viz_url }}" toolbar="bottom" hide-tabs></tableau-viz>
</div>
{% else %}
<div class="card">
  <p><strong>No Tableau URL configured.</strong> Publish your workbook to Tableau Public, then set
  <code>TABLEAU_DASHBOARD_URL</code> and <code>TABLEAU_STORY_URL</code> in your <code>.env</code> file and restart Flask.</p>
</div>
{% endif %}
